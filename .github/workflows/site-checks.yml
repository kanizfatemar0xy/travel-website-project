name: Static site checks
on:
  push:
  pull_request:
jobs:
  site-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local navigation and accessibility basics
        run: python -m unittest discover -s tests -v
